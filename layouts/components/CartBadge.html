---
<!-- CartBadge Component - Uses cart store -->
import store from './stores/cart.js'
---

<div class="cart-badge">
  <div class="cart-icon-wrapper">
    🛒
    {if $cart.items.length > 0}
      <span class="cart-count">{$cart.items.length}</span>
    {/if}
  </div>
  <div class="cart-details">
    <div class="cart-items">
      {if $cart.items.length === 0}
        <span class="empty-cart">Cart is empty</span>
      {else}
        <span class="item-count">{$cart.items.length} items</span>
      {/if}
    </div>
    {if $cart.items.length > 0}
      <div class="cart-total">
        Total: $<strong x-text="$store.cart.formattedTotal"></strong>
      </div>
    {/if}
  </div>
</div>

<style>
.cart-badge {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: #f8f9fa;
  border-radius: 8px;
  border: 1px solid #e9ecef;
  min-width: 200px;
}

.cart-icon-wrapper {
  position: relative;
  font-size: 1.5rem;
  line-height: 1;
}

.cart-count {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #dc2626;
  color: white;
  font-size: 0.75rem;
  font-weight: bold;
  padding: 0.15rem 0.4rem;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

.cart-details {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.cart-items {
  font-size: 0.9rem;
}

.empty-cart {
  color: #6b7280;
  font-style: italic;
}

.item-count {
  color: #374151;
  font-weight: 500;
}

.cart-total {
  font-size: 0.85rem;
  color: #059669;
}
</style>
