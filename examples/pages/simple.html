---
prop name = "Alice"
prop age = 30
prop items = ["apple", "banana", "orange"]
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Test</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <h1>Basic Template Test</h1>

  <div>
    <h2>Expressions</h2>
    <p>Name: {name}</p>
    <p>Age: {age}</p>
  </div>

  <div>
    <h2>Conditionals</h2>
    {if age >= 18}
      <p>{name} is an adult</p>
    {else}
      <p>{name} is a minor</p>
    {/if}
  </div>

  <div>
    <h2>Loops</h2>
    <ul>
      {for item of items}
        <li>{item}</li>
      {/for}
    </ul>
  </div>
</body>
</html>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 2rem auto;
    padding: 1rem;
  }
  h1 {
    color: #333;
  }
  div {
    margin: 2rem 0;
    padding: 1rem;
    border: 1px solid #ddd;
    border-radius: 0.5rem;
  }
</style>
