---
prop count = 0;
prop message = "Hello from script!";
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Script Tag Preservation Test</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.js"></script>
</head>
<body>
  <h1>Script Tag Preservation Test</h1>

  <div x-data="{ count: {count}, message: '{message}' }">
    <p>Count: <span x-text="count"></span></p>
    <p>Message: <span x-text="message"></span></p>
    <button @click="count++">Increment</button>
  </div>

  <script>
    // This inline script should be preserved
    console.log('Script tag preserved successfully!');
    console.log('Initial count:', {count});
    console.log('Initial message:', '{message}');

    // Client-side JavaScript
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Page loaded with Alpine.js');
    });
  </script>
</body>
</html>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 2rem;
    max-width: 600px;
    margin: 0 auto;
  }

  button {
    background: #3b82f6;
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 0.25rem;
    cursor: pointer;
    font-size: 1rem;
  }

  button:hover {
    background: #2563eb;
  }
</style>
